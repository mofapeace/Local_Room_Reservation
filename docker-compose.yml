version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: booking_db
    environment:
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_DATABASE: booking_system
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: booking_keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    command: start-dev
    ports:
      - "8080:8080"
    networks:
      - app-network

  booking-app:
    build: ./backend
    container_name: booking_app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=secretpassword
      - DB_NAME=booking_system
    depends_on:
      - db
      - keycloak
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
