version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: booking_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: room_booking
    ports:
      - "3306:3306"

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: booking_keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    # 👇 Add this to map the data
    volumes:
      - keycloak_data:/opt/keycloak/data

  booking-app:
    build: ./backend
    container_name: booking_backend
    ports:
      - "3000:3000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: booking_frontend
    ports:
      - "80:80"
    depends_on:
      - booking-app

# 👇 Add this at the very bottom
volumes:
  keycloak_data:
