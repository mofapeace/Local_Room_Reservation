<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Room Booking Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 2rem; }
        .card { background: #1e1e1e; padding: 1rem; margin: 1rem 0; border-radius: 8px; border: 1px solid #333; }
        button { background: #6200ea; color: white; border: none; padding: 0.5rem 1rem; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background: #7c4dff; }
        .status { padding: 0.5rem; margin-bottom: 1rem; border-radius: 4px; background: #333; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🔥 Room Booking Dashboard</h1>
    <div id="auth-status" class="status">Status: Checking Auth...</div>
    <button onclick="login()">Login with Keycloak</button>
    <button onclick="logout()">Logout</button>

    <div id="rooms"></div>

    <script>
        // Keycloak Config
        const KEYCLOAK_URL = "http://192.168.1.155:8080/realms/room-booking/protocol/openid-connect/auth";
        const CLIENT_ID = "booking-frontend";
        const REDIRECT_URI = "http://192.168.1.155";

        // Check the URL for a token after Keycloak redirects us back
        function handleAuth() {
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const token = params.get('access_token');

            if (token) {
                localStorage.setItem('kc_token', token);
                window.location.hash = ''; // Clean up the URL
            }

            const storedToken = localStorage.getItem('kc_token');
            const statusDiv = document.getElementById('auth-status');
            
            if (storedToken) {
                statusDiv.innerText = "Status: Authenticated 🟢";
                statusDiv.style.color = "#00e676";
                loadRooms(); // Fetch data ONLY if we have a token
            } else {
                statusDiv.innerText = "Status: Not Logged In 🔴";
                statusDiv.style.color = "#ff5252";
            }
        }

        // Send user to Keycloak login page
        function login() {
            const authUrl = `${KEYCLOAK_URL}?client_id=${CLIENT_ID}&response_type=token&redirect_uri=${encodeURIComponent(REDIRECT_URI)}`;
            window.location.href = authUrl;
        }

        // Yeet the token and refresh
        function logout() {
            localStorage.removeItem('kc_token');
            window.location.reload();
        }

        // Fetch rooms from our secure backend
        async function loadRooms() {
            const token = localStorage.getItem('kc_token');
            const res = await fetch('http://192.168.1.155:3000/api/rooms', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            if (!res.ok) {
                document.getElementById('rooms').innerHTML = '<p>Unauthorized! Backend rejected the request.</p>';
                return;
            }
            
            const rooms = await res.json();
            const container = document.getElementById('rooms');
            container.innerHTML = '';
            rooms.forEach(room => {
                container.innerHTML += `
                    <div class="card">
                        <h3>${room.name}</h3>
                        <p>Capacity: ${room.capacity}</p>
                    </div>
                `;
            });
        }

        // Run this immediately when the page loads
        handleAuth();
    </script>
</body>
</html>
