<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Booking</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 2rem; }
        .card { background: #1e1e1e; padding: 1rem; margin: 1rem 0; border-radius: 8px; }
        button { background: #6200ea; color: white; border: none; padding: 0.5rem 1rem; cursor: pointer; border-radius: 4px;}
        button:hover { background: #3700b3; }
    </style>
</head>
<body>
    <h1>🔥 Room Booking Dashboard</h1>
    <button onclick="login()">Login with Keycloak</button>
    <div id="rooms"></div>

    <script>
        // Fake login for now until Keycloak is linked
        function login() {
            window.location.href = "http://192.168.1.122:8080/realms/room-booking/account/";
        }

        // Fetch rooms from backend
        async function loadRooms() {
            const res = await fetch('http://192.168.1.122:3000/api/rooms');
            const rooms = await res.json();
            const container = document.getElementById('rooms');
            
            rooms.forEach(room => {
                container.innerHTML += `
                    <div class="card">
                        <h3>${room.name}</h3>
                        <p>Capacity: ${room.capacity} | Location: ${room.location}</p>
                        <button onclick="bookRoom(${room.id})">Book This Room</button>
                    </div>
                `;
            });
        }

        // Send booking to backend
        async function bookRoom(id) {
            const res = await fetch('http://192.168.1.122:3000/api/bookings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    resource_id: id,
                    user_email: "test@student.com",
                    start_time: "2026-10-01 10:00:00",
                    end_time: "2026-10-01 12:00:00"
                })
            });
            const data = await res.json();
            alert(data.message);
        }

        loadRooms();
    </script>
</body>
</html>
